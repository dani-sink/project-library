<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Library</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <h1 id="page-title">My Library</h1>
    <div id="book-card-container">
      <button class="add-book" id="showDialog">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
        </svg>
        <p>New Book</p>
      </button>
    </div>

    <dialog id="my-dialog">
      <form id="my-dialog-form">
        <div class="input-ele">
          <label for="title">Title</label>
          <input type="text" name="title" id="title" required />
          <div class="error" aria-live="polite"></div>
        </div>
        <div class="input-ele">
          <label for="author">Author</label>
          <input type="text" name="author" id="author" required />
          <div class="error" aria-live="polite"></div>
        </div>
        <div class="input-ele pages-and-read">
          <label for="pages" id="pages-side">
            <span>Pages?</span>
            <input
              type="number"
              name="pages"
              id="pages"
              min="1"
              max="30000"
              required
            />
          </label>
          <label for="read" id="read-side">
            <span>Read?</span>
            <input type="checkbox" name="read" id="read" />
          </label>
        </div>
        <div class="error" aria-live="polite" id="above-btns"></div>
        <div id="dialog-buttons">
          <button id="cancel-btn" value="cancel">Cancel</button>
          <button value="default" id="confirm-btn">Confirm</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
